<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" as="image" href="./assets/img/hero-crop-field-m.webp" type="image/webp" media="(max-width: 900px)" fetchpriority="high" />
    <link rel="preload" as="image" href="./assets/img/hero-crop-field.webp" type="image/webp" media="(min-width: 901px)" fetchpriority="high" />
    <!-- Site background before the CSS bundle arrives, so the first paint is not a white flash. -->
    <style>html,body{background:#f6f5ef;margin:0}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
